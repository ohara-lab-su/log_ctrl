[build-system]
requires = ["setuptools>=40.8"]
build-backend = "setuptools.build_meta"

[project]
name = "log_ctrl"
version = "0.0.1"
description = "gRPC server and proxy for reading x_logger rotating log files by device class."
readme = "README.md"
requires-python = ">=3.6"
license = { file = "LICENSE" }
authors = [
    { name = "Kengo NAKADA", email = "kengo.nakada@email.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

# grpc_frame is an external project used directly by this package.
# Add it here only when its installable distribution name/source is fixed.
dependencies = [
    "xlogger-py"
]

[project.optional-dependencies]
docs = [
    "sphinx",
    "myst-parser",
    "sphinx-rtd-theme",
    "linkify-it-py",
    "grpcio",
]
test = [
    "pytest",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
